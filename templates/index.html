<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Binary Search Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Three.js local files se (internet ki zaroorat nahi) -->
  <script type="importmap">
  {
    "imports": {
      "three": "{{ url_for('static', filename='vendor/three/three.module.js') }}",
      "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
    }
  }
  </script>
</head>
<body data-model="{{ url_for('static', filename='models/character.glb') }}" data-models-base="{{ url_for('static', filename='models/') }}" data-audio-base="{{ url_for('static', filename='audio/') }}">

  <!-- 1) Preloader -->
  <div id="preloader">
    <div class="pre-card">
      <h1>Binary Search Guide</h1>
      <div class="dots"><i></i><i></i><i></i></div>
      <p id="preText">Waking up your guide…</p>
      <div class="bar"><span id="preBar"></span></div>
    </div>
  </div>

  <canvas id="stage"></canvas>
  <div id="board"></div>

  <div id="status" class="chip hidden"></div>

  <!-- Upar ke controls (phone par do line mein wrap hote hain) -->
  <div id="tools">
    <div class="tcol">
      <div id="mode" class="pillbar" aria-label="Step mode">
        <span>Steps</span>
        <button data-m="manual" class="on">Manual <b class="k">↓</b></button>
        <button data-m="auto">Auto</button>
      </div>
      <div id="voice" class="pillbar" aria-label="Voice">
        <span>Voice</span>
        <button data-v="on" class="on">On</button>
        <button data-v="off">Off</button>
      </div>
      <div id="music" class="pillbar" aria-label="Background music">
        <span>Music</span>
        <button data-mu="on">On</button>
        <button data-mu="off" class="on">Off</button>
      </div>
    </div>
    <div class="tcol tr">
      <div id="speed" class="pillbar" aria-label="Speed">
        <span>Speed</span>
        <button data-s="1" class="on">1×</button>
        <button data-s="1.5">1.5×</button>
        <button data-s="2">2×</button>
      </div>
      <button id="logBtn" class="pillbtn hidden" type="button">Chat log</button>
    </div>
  </div>

  <button id="hint" class="hint hidden" type="button"></button>

  <!-- Conversation log -->
  <aside id="log" class="log hidden" aria-label="Conversation">
    <header><b>Conversation</b><button id="logClose" type="button" aria-label="Close">×</button></header>
    <div id="logBody"></div>
  </aside>

  <!-- Character se baat: sawal poochne ka bar -->
  <div id="you" class="you hidden"></div>
  <form id="chat" class="chatbar off hidden" autocomplete="off">
    <input id="chatInput" type="text" maxlength="400" placeholder="" disabled>
    <button id="micBtn" type="button" title="Speak (mic)" aria-label="Speak">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9.5a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.6a6 6 0 0 0 5-5.9Z"/></svg>
    </button>
    <button id="sendBtn" type="submit" disabled>Send</button>
  </form>

  <!-- Character ka speech bubble -->
  <div id="bubble" class="bubble hidden" data-side="right">
    <p><span class="typed"></span><span class="rest"></span></p>
  </div>

  <button id="again" class="btn hidden" type="button">Search again</button>

  <!-- 2) Popup form -->
  <div id="modal" class="modal hidden">
    <form id="form" class="card" autocomplete="off">
      <h2>Let the guide search for you</h2>
      <p class="sub">Enter your numbers and the one to find. The guide does the rest.</p>

      <label for="arrayInput">Array <small>({{ min_items }}–{{ max_items }} numbers, separated by commas)</small></label>
      <input id="arrayInput" type="text" placeholder="e.g. 42, 7, 19, 88, 3, 56, 23" required>

      <label for="targetInput">Number to find</label>
      <input id="targetInput" type="number" step="1" placeholder="e.g. 23" required>

      <label for="langInput">Guide speaks</label>
      <select id="langInput">
        <option value="en">English</option>
        <option value="ur">Roman Urdu</option>
      </select>

      <label for="voiceInput">Guide's voice <small>(optional, depends on your browser)</small></label>
      <select id="voiceInput"><option value="">Automatic</option></select>

      <label for="charInput">Guide's character</label>
      <select id="charInput">
        <option value="original">Original</option>
        <option value="knight">Knight</option>
        <option value="arissa">Arissa</option>
        <option value="boy">Boy</option>
      </select>

      <div id="toneBox">
      <label>Guide's skin tone</label>
      <div class="tones" role="radiogroup" aria-label="Skin tone">
        <label class="tone"><input type="radio" name="tone" value="original" checked><span style="--c:#8a5a3c"></span><em>Original</em></label>
        <label class="tone"><input type="radio" name="tone" value="fair"><span style="--c:#f2cdb0"></span><em>Fair</em></label>
        <label class="tone"><input type="radio" name="tone" value="wheatish"><span style="--c:#dfae80"></span><em>Wheatish</em></label>
        <label class="tone"><input type="radio" name="tone" value="tan"><span style="--c:#b87f56"></span><em>Tan</em></label>
        <label class="tone"><input type="radio" name="tone" value="deep"><span style="--c:#6b4129"></span><em>Deep</em></label>
      </div>
      </div>

      <p id="formError" class="error" role="alert"></p>

      <div class="actions">
        <button id="example" class="btn ghost" type="button">Use an example</button>
        <button id="startBtn" class="btn" type="submit">Start</button>
      </div>
    </form>
  </div>

  <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
